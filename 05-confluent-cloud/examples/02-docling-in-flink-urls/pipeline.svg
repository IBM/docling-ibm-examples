<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 690" width="1370" height="690" role="img" aria-labelledby="t d">
  <title id="t">Example 02 — Docling in Flink, from public URLs</title>
  <desc id="d">URLs on a Kafka topic are converted by Docling for IBM watsonx from inside a Flink statement, kept on a conversions topic, chunked onto a chunk topic, then prepared, PII-guarded and deduplicated by a second statement into enriched, quarantine and rejected topics.</desc>
  <defs>
    <style>
      .bg      { fill: #fbfaf8; stroke: #e6e4df; }
      .topic   { fill: #e8f1fc; stroke: #2a78d6; stroke-width: 1.5; }
      .stmt    { fill: #fff6ec; stroke: #eb6834; stroke-width: 1.5; }
      .box     { fill: #ffffff; stroke: #f0b48f; stroke-width: 1.2; }
      .ext     { fill: #ffffff; stroke: #898781; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .opt     { fill: none;    stroke: #898781; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .edge    { fill: none; stroke: #52514e; stroke-width: 1.6; }
      .dash    { stroke-dasharray: 6 5; }
      .ah      { fill: #52514e; }
      text     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1e1c; font-size: 13px; }
      .h       { font-weight: 650; font-size: 15px; }
      .hs      { font-weight: 650; font-size: 14px; }
      .m       { fill: #6b6964; font-size: 12px; }
      .code    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .tt      { fill: #0b3d75; }
      .st      { fill: #b4471b; }
      .lbl     { fill: #6b6964; font-size: 11.5px; font-style: italic; }
      @media (prefers-color-scheme: dark) {
        .bg    { fill: #1c1c1e; stroke: #333336; }
        .topic { fill: #13243a; stroke: #5a9be6; }
        .stmt  { fill: #2a1e14; stroke: #eb6834; }
        .box   { fill: #232325; stroke: #8a5a3c; }
        .ext   { fill: #232325; stroke: #8f8d88; }
        .opt   { stroke: #8f8d88; }
        .edge  { stroke: #bdbbb6; }
        .ah    { fill: #bdbbb6; }
        text   { fill: #ecebe8; }
        .m, .lbl { fill: #a3a19c; }
        .tt    { fill: #cfe3fb; }
        .st    { fill: #f5a274; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1369" height="689" rx="16"/>

  <!-- legend -->
  <g transform="translate(700,46)">
    <rect class="topic" x="0" y="0" width="34" height="18" rx="9"/>
    <text x="42" y="13" class="m">Kafka topic</text>
    <rect class="stmt" x="140" y="0" width="34" height="18" rx="4"/>
    <text x="182" y="13" class="m">Flink statement</text>
    <rect class="box" x="300" y="0" width="34" height="18" rx="4"/>
    <text x="342" y="13" class="m">view · UDF</text>
    <rect class="ext" x="430" y="0" width="34" height="18" rx="4"/>
    <text x="472" y="13" class="m">outside Confluent Cloud / optional</text>
  </g>

  <!-- the producer -->
  <rect class="ext" x="40" y="150" width="150" height="52" rx="8"/>
  <text x="115" y="172" text-anchor="middle" class="code">produce_urls.py</text>
  <text x="115" y="190" text-anchor="middle" class="m">or any Kafka client</text>
  <path class="edge" d="M115,202 V236" marker-end="url(#arrow)"/>

  <!-- urls -->
  <rect class="topic" x="40" y="239" width="150" height="54" rx="27"/>
  <text x="115" y="262" text-anchor="middle" class="hs tt">urls</text>
  <text x="115" y="280" text-anchor="middle" class="code tt">{doc_id, url}</text>

  <!-- Docling -->
  <rect class="ext" x="250" y="40" width="335" height="72" rx="10"/>
  <text x="267" y="66" class="h">Docling for IBM watsonx</text>
  <text x="267" y="86" class="code">convert/source/async · poll · result</text>
  <text x="267" y="103" class="m">the Markdown comes back as a presigned S3 URL</text>

  <!-- statement: convert -->
  <rect class="stmt" x="220" y="150" width="390" height="440" rx="14"/>
  <text x="240" y="178" class="h st">dol-ex02-convert</text>
  <text x="240" y="196" class="m">statement set · flink/31_convert.sql</text>

  <path class="edge" d="M190,266 H242" marker-end="url(#arrow)"/>
  <path class="edge" d="M505,112 V222" marker-end="url(#arrow)"/>
  <path class="edge" d="M555,222 V115" marker-end="url(#arrow)"/>
  <text x="498" y="136" class="lbl" text-anchor="end">URL</text>
  <text x="562" y="136" class="lbl">Markdown</text>

  <rect class="box" x="245" y="225" width="340" height="80" rx="8"/>
  <text x="260" y="248" class="hs">converted</text>
  <text x="260" y="268" class="code">dc_convert(url) — Java UDF, async</text>
  <text x="260" y="288" class="m">2 CONNECTIONs · 45 s deadline · failures are rows</text>

  <path class="edge" d="M415,305 V372" marker-end="url(#arrow)"/>

  <rect class="box" x="245" y="375" width="340" height="62" rx="8"/>
  <text x="260" y="399" class="hs">converted_all</text>
  <text x="260" y="420" class="m">new conversions ∪ the topic's history</text>

  <path class="edge" d="M415,437 V477" marker-end="url(#arrow)"/>

  <rect class="box" x="245" y="480" width="340" height="80" rx="8"/>
  <text x="260" y="503" class="hs">chunk</text>
  <text x="260" y="523" class="code">dc_chunks(…) — Python UDF</text>
  <text x="260" y="543" class="m">headings + paragraphs · CROSS JOIN UNNEST</text>

  <!-- conversions -->
  <path class="edge" d="M585,265 H647" marker-end="url(#arrow)"/>
  <rect class="topic" x="650" y="238" width="170" height="56" rx="28"/>
  <text x="735" y="262" text-anchor="middle" class="hs tt">conversions</text>
  <text x="735" y="280" text-anchor="middle" class="m tt">typed · kept for good</text>

  <path class="edge dash" d="M735,294 V406 H588" marker-end="url(#arrow)"/>
  <text x="744" y="336" class="lbl">re-read on</text>
  <text x="744" y="352" class="lbl">redeploy: chunks</text>
  <text x="744" y="368" class="lbl">rebuilt, nothing</text>
  <text x="744" y="384" class="lbl">converted twice</text>

  <!-- chunks -->
  <path class="edge" d="M585,519 H647" marker-end="url(#arrow)"/>
  <rect class="topic" x="650" y="491" width="170" height="56" rx="28"/>
  <text x="735" y="515" text-anchor="middle" class="hs tt">chunks</text>
  <text x="735" y="533" text-anchor="middle" class="m tt">the seam · example 01's</text>

  <path class="edge" d="M820,519 H852 V250 H887" marker-end="url(#arrow)"/>

  <!-- statement: pipeline -->
  <rect class="stmt" x="870" y="150" width="270" height="440" rx="14"/>
  <text x="890" y="178" class="h st">dol-ex02-pipeline</text>
  <text x="890" y="196" class="m">common/flink — same as example 01</text>

  <rect class="box" x="890" y="215" width="230" height="72" rx="8"/>
  <text x="905" y="238" class="hs">prepare</text>
  <text x="905" y="258" class="code">dc_is_chunk · dc_prepare</text>
  <text x="905" y="276" class="m">normalize, derive fields</text>

  <path class="edge" d="M1005,287 V322" marker-end="url(#arrow)"/>

  <rect class="box" x="890" y="325" width="230" height="72" rx="8"/>
  <text x="905" y="348" class="hs">guard</text>
  <text x="905" y="368" class="code">dc_guard</text>
  <text x="905" y="386" class="m">PII → redact · quality gate</text>

  <path class="edge" d="M1005,397 V432" marker-end="url(#arrow)"/>

  <rect class="box" x="890" y="435" width="230" height="72" rx="8"/>
  <text x="905" y="458" class="hs">dedup</text>
  <text x="905" y="478" class="code">ROW_NUMBER() = 1</text>
  <text x="905" y="496" class="m">by content fingerprint</text>

  <!-- outputs -->
  <path class="edge" d="M1120,340 H1150 V282 H1177" marker-end="url(#arrow)"/>
  <rect class="topic" x="1180" y="255" width="170" height="54" rx="27"/>
  <text x="1265" y="278" text-anchor="middle" class="hs tt">quality.rejected</text>
  <text x="1265" y="296" text-anchor="middle" class="m tt">dropped, kept visible</text>

  <path class="edge" d="M1120,370 H1177" marker-end="url(#arrow)"/>
  <rect class="topic" x="1180" y="343" width="170" height="54" rx="27"/>
  <text x="1265" y="366" text-anchor="middle" class="hs tt">pii.quarantine</text>
  <text x="1265" y="384" text-anchor="middle" class="m tt">the originals</text>

  <path class="edge" d="M1120,471 H1177" marker-end="url(#arrow)"/>
  <rect class="topic" x="1180" y="444" width="170" height="54" rx="27"/>
  <text x="1265" y="467" text-anchor="middle" class="hs tt">chunks.enriched</text>
  <text x="1265" y="485" text-anchor="middle" class="m tt">redacted · deduplicated</text>

  <!-- optional: embeddings -->
  <path class="edge dash" d="M1265,498 V529" marker-end="url(#arrow)"/>
  <rect class="opt" x="1180" y="532" width="170" height="58" rx="8"/>
  <text x="1265" y="555" text-anchor="middle" class="code">AI_EMBEDDING(text)</text>
  <text x="1265" y="575" text-anchor="middle" class="m">optional · native in Flink SQL</text>

  <!-- footer -->
  <text x="40" y="632" class="m">Two statements, split at the chunk topic: the paid conversion runs once per URL; the enrichment is the part you redeploy.</text>
  <text x="40" y="652" class="m">Each statement's output is visible at its commit (~1 min). A conversion takes 1–4 s on the service. scripts/report.py follows every document.</text>
</svg>
