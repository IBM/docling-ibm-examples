# Example 04's Python UDF artifact: the fake Docling extraction, and the step
# that turns an extraction into an invoice record.
#
#   ./build.sh          -> dist/invoice_udf-0.1.0.zip, ready to upload
#   uv run pytest       -> the logic, without a cluster
#
# Its own package rather than more functions in common/udf, because it carries
# example data: the fake extraction answers from data/manifest.jsonl, which
# build.sh compiles into the package. The constraints are the same list as
# common/udf's — Confluent Cloud's Python UDF runtime pins them — and the
# same rule applies: copy them from there, never choose them here.
[project]
name = "invoice-udf"
version = "0.1.0"
description = "Invoice extraction for example 04, as Confluent Cloud Flink Python UDFs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "apache-flink==2.0.0",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[tool.uv]
constraint-dependencies = [
    "apache-flink==2.0.0",
    "click>=8.2.0",
    "confluent-function-runtime-core>=0.181.0",
    "grpc-interceptor>=0.15.0",
    "grpcio-health-checking>=1.65.0",
    "grpcio-reflection>=1.65.0",
    "grpcio>=1.65.0",
    "protobuf>=5.29.1",
    "psutil>=5.9.0",
    "pyparsing>=3.2.5",
    "typing_extensions>=4.4.0",
]

# Same Apple Silicon workaround as common/udf: apache-beam's sdist needs
# setuptools at build time and does not say so.
[tool.uv.extra-build-dependencies]
apache-beam = ["setuptools<78"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Generated by build.sh from data/manifest.jsonl.
"src/invoice_udf/_truth.py" = ["ALL"]
