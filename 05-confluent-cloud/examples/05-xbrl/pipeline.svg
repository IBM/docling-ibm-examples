<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 580" width="1370" height="580" role="img" aria-labelledby="t d">
  <title id="t">Example 05 — SEC filings, converted as they are published</title>
  <desc id="d">sec_producer.py reads SEC EDGAR's current-filings feed and writes one record per filing to the filings topic. A first Flink statement calls dc_metrics for each filing: Docling for IBM watsonx fetches the inline XBRL report itself and returns a DoclingDocument, from which only the figures are read and unnested into the metrics topic. A second statement pivots the metrics into one row per filing with its ratios, runs five detectors on it and upserts the events topic.</desc>
  <defs>
    <style>
      .bg      { fill: #fbfaf8; stroke: #e6e4df; }
      .topic   { fill: #e8f1fc; stroke: #2a78d6; stroke-width: 1.5; }
      .stmt    { fill: #fff6ec; stroke: #eb6834; stroke-width: 1.5; }
      .box     { fill: #ffffff; stroke: #f0b48f; stroke-width: 1.2; }
      .ext     { fill: #ffffff; stroke: #898781; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .opt     { fill: none;    stroke: #898781; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .edge    { fill: none; stroke: #52514e; stroke-width: 1.6; }
      .dash    { stroke-dasharray: 6 5; }
      .ah      { fill: #52514e; }
      text     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f1e1c; font-size: 13px; }
      .h       { font-weight: 650; font-size: 15px; }
      .hs      { font-weight: 650; font-size: 14px; }
      .m       { fill: #6b6964; font-size: 12px; }
      .code    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
      .tt      { fill: #0b3d75; }
      .st      { fill: #b4471b; }
      .lbl     { fill: #6b6964; font-size: 11.5px; font-style: italic; }
      @media (prefers-color-scheme: dark) {
        .bg    { fill: #1c1c1e; stroke: #333336; }
        .topic { fill: #13243a; stroke: #5a9be6; }
        .stmt  { fill: #2a1e14; stroke: #eb6834; }
        .box   { fill: #232325; stroke: #8a5a3c; }
        .ext   { fill: #232325; stroke: #8f8d88; }
        .opt   { stroke: #8f8d88; }
        .edge  { stroke: #bdbbb6; }
        .ah    { fill: #bdbbb6; }
        text   { fill: #ecebe8; }
        .m, .lbl { fill: #a3a19c; }
        .tt    { fill: #cfe3fb; }
        .st    { fill: #f5a274; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1369" height="579" rx="16"/>

  <!-- legend -->
  <g transform="translate(700,46)">
    <rect class="topic" x="0" y="0" width="34" height="18" rx="9"/>
    <text x="42" y="13" class="m">Kafka topic</text>
    <rect class="stmt" x="140" y="0" width="34" height="18" rx="4"/>
    <text x="182" y="13" class="m">Flink statement</text>
    <rect class="box" x="300" y="0" width="34" height="18" rx="4"/>
    <text x="342" y="13" class="m">view · UDF</text>
    <rect class="ext" x="430" y="0" width="34" height="18" rx="4"/>
    <text x="472" y="13" class="m">outside Confluent Cloud / optional</text>
  </g>

  <!-- SEC EDGAR and the producer -->
  <rect class="ext" x="40" y="40" width="150" height="56" rx="8"/>
  <text x="115" y="64" text-anchor="middle" class="hs">SEC EDGAR</text>
  <text x="115" y="82" text-anchor="middle" class="m">feed · filing folders</text>
  <path class="edge" d="M115,96 V147" marker-end="url(#arrow)"/>
  <text x="124" y="126" class="lbl">Atom feed</text>

  <rect class="ext" x="40" y="150" width="150" height="52" rx="8"/>
  <text x="115" y="172" text-anchor="middle" class="code">sec_producer.py</text>
  <text x="115" y="190" text-anchor="middle" class="m">once · watch · replay</text>
  <path class="edge" d="M115,202 V236" marker-end="url(#arrow)"/>

  <!-- filings -->
  <rect class="topic" x="40" y="239" width="150" height="54" rx="27"/>
  <text x="115" y="262" text-anchor="middle" class="hs tt">filings</text>
  <text x="115" y="280" text-anchor="middle" class="code tt">{doc_id, ixbrl_url}</text>

  <!-- Docling -->
  <rect class="ext" x="250" y="40" width="335" height="72" rx="10"/>
  <text x="267" y="66" class="h">Docling for IBM watsonx</text>
  <text x="267" y="86" class="code">convert/source/async · poll · result</text>
  <text x="267" y="103" class="m">fetches the iXBRL report itself, with our User-Agent</text>
  <path class="edge" d="M190,76 H247" marker-end="url(#arrow)"/>
  <text x="196" y="68" class="lbl">the .htm</text>

  <!-- statement: metrics -->
  <rect class="stmt" x="220" y="150" width="390" height="320" rx="14"/>
  <text x="240" y="178" class="h st">ceb-ex05-metrics</text>
  <text x="240" y="196" class="m">statement · flink/31_metrics.sql, 22_view_extracted.sql</text>

  <path class="edge" d="M190,266 H242" marker-end="url(#arrow)"/>
  <path class="edge" d="M505,222 V115" marker-end="url(#arrow)"/>
  <path class="edge" d="M555,115 V222" marker-end="url(#arrow)"/>
  <text x="498" y="136" class="lbl" text-anchor="end">URL</text>
  <text x="562" y="136" class="lbl">DoclingDocument</text>

  <rect class="box" x="245" y="225" width="340" height="80" rx="8"/>
  <text x="260" y="248" class="hs">extracted</text>
  <text x="260" y="268" class="code">dc_metrics(url) — Java UDF, async</text>
  <text x="260" y="288" class="m">2 CONNECTIONs · 45 s deadline · failures are rows</text>

  <path class="edge" d="M415,305 V362" marker-end="url(#arrow)"/>
  <text x="425" y="338" class="lbl">only the figures leave</text>

  <rect class="box" x="245" y="365" width="340" height="80" rx="8"/>
  <text x="260" y="388" class="hs">figures</text>
  <text x="260" y="408" class="code">CROSS JOIN UNNEST(figures)</text>
  <text x="260" y="428" class="m">one row per figure · JSON_VALUE into typed columns</text>

  <!-- metrics -->
  <path class="edge" d="M585,420 H647" marker-end="url(#arrow)"/>
  <rect class="topic" x="650" y="392" width="170" height="56" rx="28"/>
  <text x="735" y="416" text-anchor="middle" class="hs tt">metrics</text>
  <text x="735" y="434" text-anchor="middle" class="m tt">typed · one per figure</text>

  <path class="edge" d="M820,420 H852 V261 H887" marker-end="url(#arrow)"/>

  <!-- statement: events -->
  <rect class="stmt" x="870" y="150" width="270" height="320" rx="14"/>
  <text x="890" y="178" class="h st">ceb-ex05-events</text>
  <text x="890" y="196" class="m">statement · flink/32_events.sql</text>

  <rect class="box" x="890" y="215" width="230" height="92" rx="8"/>
  <text x="905" y="238" class="hs">financials</text>
  <text x="905" y="258" class="code">23_view_financials</text>
  <text x="905" y="276" class="m">latest per filing · in dollars</text>
  <text x="905" y="294" class="m">pivot · growth, margins, ratios</text>

  <path class="edge" d="M1005,307 V332" marker-end="url(#arrow)"/>

  <rect class="box" x="890" y="335" width="230" height="92" rx="8"/>
  <text x="905" y="358" class="hs">five detectors</text>
  <text x="905" y="378" class="code">SELECT … UNION ALL</text>
  <text x="905" y="396" class="m">net income · operating cash flow</text>
  <text x="905" y="414" class="m">gross margin · costs · cash</text>

  <text x="890" y="452" class="m">thresholds: EVENT_* in env.sh</text>

  <!-- events -->
  <path class="edge" d="M1120,381 H1177" marker-end="url(#arrow)"/>
  <rect class="topic" x="1180" y="354" width="170" height="54" rx="27"/>
  <text x="1265" y="377" text-anchor="middle" class="hs tt">events</text>
  <text x="1265" y="395" text-anchor="middle" class="m tt">upsert · compacted</text>

  <!-- optional: look at them -->
  <path class="edge dash" d="M1265,408 V439" marker-end="url(#arrow)"/>
  <rect class="opt" x="1180" y="442" width="170" height="58" rx="8"/>
  <text x="1265" y="465" text-anchor="middle" class="code">report.py --events</text>
  <text x="1265" y="485" text-anchor="middle" class="m">or the SQL workspace</text>

  <!-- footer -->
  <text x="40" y="530" class="m">Two statements, split at the metrics topic: the paid conversion runs once per filing; the events are derived from the figures, so a new threshold costs nothing.</text>
  <text x="40" y="550" class="m">No DoclingDocument is stored: 14 MB for a 10-Q against a 4 MB UDF row, so it is read and dropped inside dc_metrics. scripts/report.py follows every filing.</text>
</svg>
