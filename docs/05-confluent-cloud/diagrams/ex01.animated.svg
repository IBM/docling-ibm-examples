<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Example 01 — Docling outside Flink</title>
  <desc id="d">Your PDFs are converted and chunked by Docling for IBM watsonx, outside Confluent Cloud, which writes one Kafka message per chunk with its kafka_chunks target. In Confluent Cloud a Flink statement normalizes, PII-guards, deduplicates and quality-gates the chunks into enriched, quarantine and rejected topics.</desc>
