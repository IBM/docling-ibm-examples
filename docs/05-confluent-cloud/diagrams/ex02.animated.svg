<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Example 02 — Docling in Flink, from public URLs</title>
  <desc id="d">You write URLs to a topic. A Flink statement calls Docling for IBM watsonx for each one, keeps every answer on a conversions topic for good, and chunks it onto the chunk topic. The shared enrichment takes it from there into enriched, quarantine and rejected topics.</desc>
