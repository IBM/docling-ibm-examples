<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
  <title id="t">Example 03 — Docling in Flink, from a private S3 bucket</title>
  <desc id="d">Upload a file to a private S3 bucket. Its notification goes to an SQS queue, which Confluent&#x27;s managed SQS Source connector turns into records on an objects topic. A Flink statement presigns each object and calls Docling for IBM watsonx, which fetches the file itself by the presigned URL. Conversions are kept, chunks go through the shared enrichment.</desc>
