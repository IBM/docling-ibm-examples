<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">Example 04 — invoice extraction on a simulated clock</title>
  <desc id="d">A control app releases simulated days of supplier invoices and ECB FX rates. One Flink statement extracts vendor, total and line items from each invoice — with Docling for real, or synthetically from the ground truth, chosen per release — merges the pages, converts to EUR at the day&#x27;s rate, and keeps daily, monthly and per-vendor spend reports. A live dashboard reads them; the Real-Time Context Engine serves lightning queries.</desc>
