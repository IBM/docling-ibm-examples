  <text x="532" y="141.5" class="h t-docling">Docling for IBM watsonx</text>
  <text x="532" y="160.5" class="m">fetches the report itself</text>
  <path class="edge" d="M266,146 H467" marker-end="url(#arrow)"/>
  <text x="290" y="134" class="lbl">the iXBRL report, by its URL</text>
  <text x="290" y="168" class="lbl">with our User-Agent</text>
