  <text x="98" y="345.5" class="h t-ext">sec_producer.py</text>
  <text x="98" y="364.5" class="m">once · --watch · --replay</text>
  <text x="40" y="414" class="s">--local writes data/queue/ on disk,</text>
  <text x="40" y="430" class="s">to try it without Kafka</text>
