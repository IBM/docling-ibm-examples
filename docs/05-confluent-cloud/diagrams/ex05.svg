  <text x="98" y="132.0" class="h t-ext">SEC EDGAR</text>
  <text x="98" y="151.0" class="m">current filings feed</text>
  <text x="98" y="169.0" class="m">and each filing&#x27;s folder</text>
  <path class="edge" d="M151,182 V311" marker-end="url(#arrow)"/>
  <text x="160" y="250" class="lbl">Atom feed</text>
