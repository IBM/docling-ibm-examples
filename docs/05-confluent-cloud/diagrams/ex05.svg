  <text x="989" y="474.0" class="h t-ok">events</text>
  <text x="989" y="491.0" class="s">upsert · what changed</text>
  <text x="316" y="398" class="s">One billed conversion</text>
  <text x="316" y="414" class="s">per filing; a redeploy</text>
  <text x="316" y="430" class="s">never converts twice.</text>
  <text x="494" y="476" class="s">Only the figures are kept: the DoclingDocument (14 MB for a 10-Q)</text>
  <text x="494" y="492" class="s">is read and dropped inside dc_metrics, never a row.</text>
