<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-labelledby="t d">
  <title id="t">Example 05 — SEC filings, converted as they are published</title>
  <desc id="d">sec_producer.py polls SEC EDGAR&#x27;s current-filings feed for new 10-K and 10-Q filings and writes one metadata record per filing to the filings topic in Confluent Cloud. A Flink statement calls dc_metrics for each filing: Docling for IBM watsonx fetches the inline XBRL report from SEC EDGAR itself and converts it, and the figures are read from the tables of the DoclingDocument into the metrics topic. A second Flink statement derives financial events from the metrics into the events topic. The converted document is never kept.</desc>
