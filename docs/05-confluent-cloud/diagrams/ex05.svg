  <text x="36" y="48" class="title">05 — SEC filings, converted as they are published</text>
  <text x="36" y="74" class="lede">New reports stream in from SEC EDGAR; Docling reads each one inside Flink, and the figures become events.</text>
  <rect class="card f-ext shadow" filter="url(#shadow)" x="36" y="110" width="230" height="72" rx="12"/>
  <circle cx="70" cy="146.0" r="18" class="l-ext"/>
